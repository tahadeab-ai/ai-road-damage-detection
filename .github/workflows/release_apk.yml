name: VeloPath AI Cloud Builder & Release APK

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  rust-core-verify:
    name: Rust Core Unit & Geometry Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Core Test Suite (Zero-Hardware CI)
        run: |
          cargo test --manifest-path rust_core/Cargo.toml --all --verbose

  build-release-apk:
    name: Cross-Compile Native Rust & Build Release APK
    needs: rust-core-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Set up Rust & Android Compilation Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-Compile velopath_engine for Android ABIs
        working-directory: rust_core
        run: |
          mkdir -p ../mobile_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../mobile_app/android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../mobile_app/android/app/src/main/jniLibs/x86_64

          cargo ndk -t arm64-v8a -o ../mobile_app/android/app/src/main/jniLibs build -p velopath_engine --release
          cargo ndk -t armeabi-v7a -o ../mobile_app/android/app/src/main/jniLibs build -p velopath_engine --release
          cargo ndk -t x86_64 -o ../mobile_app/android/app/src/main/jniLibs build -p velopath_engine --release

          ls -lh ../mobile_app/android/app/src/main/jniLibs/*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Generate High-Resolution VeloPath Launcher Icons
        working-directory: mobile_app
        run: dart run flutter_launcher_icons

      - name: Flutter Static Analysis
        working-directory: mobile_app
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: mobile_app
        run: flutter test

      - name: Generate CI Release Keystore
        working-directory: mobile_app
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias velopath -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass velopath123 -keypass velopath123 \
            -dname "CN=VeloPath AI, OU=Engineering, O=VeloPath, L=San Francisco, S=CA, C=US"

      - name: Build Signed ABI-Split Release APKs
        working-directory: mobile_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile_app/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: velopath123
          ANDROID_KEY_ALIAS: velopath
          ANDROID_KEY_PASSWORD: velopath123
        run: flutter build apk --release --split-per-abi

      - name: Compute Checksums
        working-directory: mobile_app
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > app-arm64-v8a-release.apk.sha256
          cat app-arm64-v8a-release.apk.sha256

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloPath-AI-v2.0-Release-APKs
          path: |
            mobile_app/build/app/outputs/flutter-apk/*-release.apk
            mobile_app/build/app/outputs/flutter-apk/*.sha256
