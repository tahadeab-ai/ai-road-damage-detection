[workspace]
resolver = "2"
members = [
    "velopath_engine",
    "velopath_webcam_cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["VeloPath AI Engineering Team <engineering@velopath.ai>"]
license = "Apache-2.0"
repository = "https://github.com/tahadeab-ai/ai-road-damage-detection"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
