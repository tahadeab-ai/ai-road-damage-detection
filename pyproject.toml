[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-damage"
version = "0.1.0"
description = "Professional AI Road Damage Detection System using modern YOLO architectures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Antigravity CV Engineering Team"}
]
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "numpy>=1.23.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
