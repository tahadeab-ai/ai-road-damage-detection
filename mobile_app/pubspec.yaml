name: road_guard_mobile
description: "RoadGuard Mobile - Enterprise AI Road Damage Detection System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture & State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # On-Device AI & Computer Vision
  tflite_flutter: ^0.10.4
  camera: ^0.11.0+2
  image: ^4.5.2

  # Geolocation & Telemetry
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Offline Persistence & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # Device Hardware & Alerts
  permission_handler: ^11.3.1
  audioplayers: ^6.1.2

  # UI/UX, Animations & Analytics Charts
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  onnxruntime: ^1.4.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/sounds/
    - assets/icon/
