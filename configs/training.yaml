# Training Pipeline Hyperparameters & Optimization Configuration

defaults:
  epochs: 30
  smoke_test_epochs: 1
  imgsz: 640
  device: 0  # GPU device index, or 'cpu'
  amp: true  # Automatic Mixed Precision
  workers: 4
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  patience: 10  # Early stopping patience in epochs
  save: true
  save_period: -1
  project: "runs/detect"
  name: "rdd_experiment"

# VRAM Auto-adaptation Guard
vram_guard:
  enabled: true
  min_free_vram_gb: 2.0
  vram_to_batch_mapping:
    # GB VRAM available -> Max recommended batch size for 640px
    16: 32
    12: 16
    8: 8
    4: 4

# Augmentation Policies
augmentations:
  baseline:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0
    copy_paste: 0.0

  advanced:
    hsv_h: 0.02
    hsv_s: 0.8
    hsv_v: 0.5
    degrees: 5.0
    translate: 0.15
    scale: 0.6
    shear: 2.0
    perspective: 0.0005
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.15
    copy_paste: 0.1

# Experiment Scenarios
experiments:
  exp_a_nano_baseline:
    model: "nano"
    aug_preset: "baseline"
    description: "Baseline YOLO11 Nano model with standard mosaic augmentation"
  exp_a_small_baseline:
    model: "small"
    aug_preset: "baseline"
    description: "Baseline YOLO11 Small model with standard mosaic augmentation"
  exp_b_advanced_aug:
    model: "nano"
    aug_preset: "advanced"
    description: "YOLO11 Nano with advanced geometric & MixUp augmentations"
