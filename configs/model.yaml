# Model Architecture Configuration
architecture_family: "yolo11"  # Options: yolo11, yolov8
license: "AGPL-3.0 / Enterprise Commercial by Ultralytics"

variants:
  nano:
    name: "yolo11n"
    weights: "yolo11n.pt"
    params_m: 2.6
    flops_b: 6.5
    recommended_imgsz: 640
    batch_size_gpu: 32
    target_device: "Edge devices, mobile embedded systems, real-time dashcam"

  small:
    name: "yolo11s"
    weights: "yolo11s.pt"
    params_m: 9.4
    flops_b: 21.5
    recommended_imgsz: 640
    batch_size_gpu: 16
    target_device: "Server GPU inference, high-accuracy inspection vehicles"

active_variant: "nano"
input_shape:
  channels: 3
  height: 640
  width: 640

export:
  format: "onnx"
  dynamic: true
  opset: 17
  simplify: true
